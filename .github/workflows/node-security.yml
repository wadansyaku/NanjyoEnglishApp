name: Node security validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Verify patched Node
        run: |
          node --version
          test "$(node -p 'process.versions.node')" = "22.23.4"
      - name: Install existing declared dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
